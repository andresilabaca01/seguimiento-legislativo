name: Actualizar monitor legislativo ABIF

on:
  workflow_dispatch:
  schedule:
    # Cuatro revisiones diarias de lunes a viernes.
    # GitHub Actions utiliza UTC.
    - cron: '15 11,15,19,23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: monitor-legislativo-abif
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar scraper coordinado Cámara + Senado
        env:
          USAR_JINA_FALLBACK: '1'
          PAUSA_SENADO: '0.15'
        run: python scraper_abif_v7.py --input proyectos.json --output proyectos.json

      - name: Validar JSON generado
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('proyectos.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          assert isinstance(data.get('proyectos'), list) and data['proyectos'], 'JSON sin proyectos'
          assert data.get('generado'), 'Falta timestamp generado'
          assert data.get('politica_bandeja', {}).get('fecha_minima_ingreso') == '2026-06-01'

          print(
              'OK:',
              len(data['proyectos']),
              'proyectos;',
              len(data.get('candidatos', [])),
              'candidatos'
          )
          PY

      - name: Publicar cambios si los hay
        run: |
          if git diff --quiet -- proyectos.json; then
            echo "Sin cambios en proyectos.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add proyectos.json
          git commit -m "Actualizar monitor legislativo"
          git push
